<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#FFD700" stroke="#000" stroke-width="3">
    <!-- Head -->
    <circle cx="100" cy="100" r="75"/>
    <!-- Ears -->
    <circle cx="50" cy="40" r="20"/>
    <circle cx="150" cy="40" r="20"/>
    <!-- Eyes -->
    <circle cx="75" cy="90" r="7" fill="#000"/>
    <circle cx="125" cy="90" r="7" fill="#000"/>
    <!-- Nose -->
    <ellipse cx="100" cy="110" rx="10" ry="7" fill="#000"/>
    <!-- Mouth -->
    <path d="M 85 125 Q 100 140 115 125" stroke="#FF0000" fill="none"/>
  </g>
</svg>
